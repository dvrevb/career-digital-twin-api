version = 0.1

[default.global.parameters]
stack_name = "career-digital-twin-api"

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "eu-central-1"
# Populate on first `sam deploy --guided`; these are the values you'll be prompted for.
# parameter_overrides = "AcmCertificateArn=arn:aws:acm:eu-central-1:...:certificate/..."

[default.build.parameters]
use_container = false

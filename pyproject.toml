[project]
name = "career-digital-twin-api"
version = "1.0.0"
description = "FastAPI + Lambda backend for the career digital twin chatbot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "mangum>=0.19.0",
    "slowapi>=0.1.9",
    "openai>=2.24.0",
    "pypdf>=6.7.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn>=0.30.0",
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
